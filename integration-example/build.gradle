plugins { id 'com.android.application' }
android {
    namespace 'in.advancedcamera.example'
    compileSdk 35
    defaultConfig {
        applicationId 'in.advancedcamera.example'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-integration-example'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation project(':advanced-camera') }
