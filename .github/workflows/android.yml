name: Android CI
on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        id: sdk
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 platform and build tools
        id: platforms
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile camera library and applications
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle :advanced-camera:assembleRelease :camera-app:assembleDebug :integration-example:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/openframe-build.log"
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openframe-debug-apks
          path: |
            camera-app/build/outputs/apk/debug/*.apk
            integration-example/build/outputs/apk/debug/*.apk
            advanced-camera/build/outputs/aar/*.aar
      - name: Publish CI result as GitHub commit status
        if: ${{ always() && github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = "success" ]; then
            STATE=success
            SUMMARY="Android APK and AAR build succeeded"
          else
            STATE=failure
            SUMMARY="Android CI failed - open workflow logs"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context="openframe/android-build" \
            -f description="$SUMMARY" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
